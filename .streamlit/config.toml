# Black and orange research terminal. Secrets go in .streamlit/secrets.toml (gitignored) or the Streamlit Cloud secrets box.
[theme]
base = "dark"
primaryColor = "#ff7a1a"
backgroundColor = "#0a0908"
secondaryBackgroundColor = "#17140f"
textColor = "#ede4d3"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
